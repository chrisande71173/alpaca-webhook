<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Trader</title>
  <style>
    :root {
      --bg: #0f1419; --card: #182029; --line: #2a3542; --text: #e6edf3;
      --muted: #8b98a5; --accent: #2f81f7; --good: #3fb950; --bad: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: radial-gradient(circle at 50% 0%, #1b2633 0%, var(--bg) 60%);
      color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: rgba(47, 129, 247, .15); border: 1px solid rgba(47, 129, 247, .4); margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-left: 6px;
      background: rgba(63, 185, 80, .15); color: var(--good); border: 1px solid rgba(63, 185, 80, .4);
      vertical-align: middle;
    }
    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg); color: var(--text); font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      width: 100%; margin-top: 16px; padding: 11px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .error {
      margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px;
      background: rgba(248, 81, 73, .1); border: 1px solid rgba(248, 81, 73, .4); color: var(--bad);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2f81f7" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/>
        <polyline points="14 7 21 7 21 14"/></svg>
    </div>
    <h1>Trader settings <span class="badge">Paper</span></h1>
    <p class="sub">Sign in to view and change the trading settings.</p>

    {% if disabled %}
      <p class="error">The settings page is turned off. Set <code>ADMIN_PASSWORD</code> on the server to enable it.</p>
    {% else %}
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login" id="login">
        <input type="hidden" name="next" value="{{ next }}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Sign in</button>
      </form>
    {% endif %}
  </main>
  <script>
    const form = document.getElementById("login");
    if (form) form.addEventListener("submit", () => {
      const button = form.querySelector("button");
      button.disabled = true;
      button.textContent = "Signing in…";
    });
  </script>
</body>
</html>
